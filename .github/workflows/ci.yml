name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-portable-core:
    name: Linux portable-core tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Test portable core
        run: make test
      - name: Lint portable core
        run: make lint

  macos-core-only:
    name: macOS portable-core tests (native app tests pending)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Test portable core on macOS
        run: make test-mac
