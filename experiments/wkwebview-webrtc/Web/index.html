<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iDroid WKWebView WebRTC probe</title>
  <style>
    :root { color-scheme: dark; font: 15px -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; padding: 24px; background: #101114; color: #f5f5f7; }
    main { max-width: 980px; margin: 0 auto; }
    h1 { font-size: 24px; font-weight: 650; }
    p { color: #a8a8b0; }
    #status { padding: 10px 12px; border-radius: 10px; background: #202126; }
    video { display: block; width: min(100%, 900px); aspect-ratio: 16 / 9; background: #050505; border-radius: 14px; }
    #input-target { margin-top: 16px; padding: 20px; border: 1px solid #3b3d47; border-radius: 12px; outline: none; }
    #input-target:focus { border-color: #6e9eff; }
    #input-target { position: relative; overflow: hidden; }
    #input-target::after { content: ""; position: absolute; inset: 0 auto 0 -35%; width: 35%; background: linear-gradient(90deg, transparent, rgba(110,158,255,.38), transparent); animation: sweep 1.4s linear infinite; pointer-events: none; }
    #input-target.input-hit { background: #254f7d; }
    @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(390%); } }
    code { color: #a9c7ff; }
  </style>
</head>
<body>
<main>
  <h1>WKWebView WebRTC feasibility probe</h1>
  <p>This is a local loopback. It is not an Android or network measurement.</p>
  <div id="status">Waiting for native probe…</div>
  <video id="remote" autoplay muted playsinline></video>
  <div id="input-target" tabindex="0">Input target — click or type here for manual samples.</div>
</main>
<script>
(() => {
  const status = document.getElementById('status');
  const video = document.getElementById('remote');
  const target = document.getElementById('input-target');
  const INPUT_ACK_TIMEOUT_MS = 1000;
  let startTime = 0;
  let setupReadyMs = null;
  let firstFrameMs = null;
  let callbackCount = 0;
  let presentedRepeats = 0;
  let nonMonotonic = 0;
  let lastPresented = -1;
  let sourceFrames = 0;
  let sourceCanvas;
  let sourceStream;
  let inboundPeer;
  let outboundPeer;
  let remoteTrackReceived = false;
  let remotePlaybackStarted = false;
  const scripted = [];
  const manual = [];
  const pendingInputs = new Map();
  let nextInputSequence = 1;
  let scriptedScheduledCount = 0;
  let scriptedDispatchedCount = 0;

  function send(body) {
    if (window.webkit?.messageHandlers?.probe) {
      window.webkit.messageHandlers.probe.postMessage(body);
    }
  }

  function setStatus(value) { status.textContent = value; }

  function percentile(values, p) {
    if (!values.length) return null;
    const sorted = values.slice().sort((a, b) => a - b);
    const index = Math.min(sorted.length - 1, Math.floor((sorted.length - 1) * p));
    return sorted[index];
  }

  function finishInputSample(pending, frameAt, acknowledged) {
    if (!pendingInputs.has(pending.sequence)) return;
    pendingInputs.delete(pending.sequence);
    const frameDelayMs = frameAt - pending.handlerAt;
    pending.sample.legacyResponseMs = frameDelayMs;
    pending.sample.handlerToNextAnimationFrameMs = acknowledged ? frameDelayMs : null;
    pending.sample.acknowledged = acknowledged;
    pending.sample.missingAcknowledgement = !acknowledged;
    pending.sample.timedOut = pending.sample.timedOut || frameDelayMs > INPUT_ACK_TIMEOUT_MS;
    pending.collection.push(pending.sample);
  }

  function recordInput(collection, kind, event, dispatchAtMs = null, scheduledAtMs = null) {
    const handlerAt = performance.now();
    const sequence = nextInputSequence++;
    const sample = {
      sequence,
      kind,
      trusted: Boolean(event && event.isTrusted),
      scheduledAtMs,
      dispatchAtMs,
      handlerAtMs: handlerAt - startTime,
      dispatchToHandlerMs: dispatchAtMs === null ? null : handlerAt - dispatchAtMs,
      scheduledToDispatchMs: scheduledAtMs === null ? null : dispatchAtMs - scheduledAtMs,
      legacyResponseMs: null,
      handlerToNextAnimationFrameMs: null,
      acknowledged: false,
      missingAcknowledgement: false,
      timedOut: false
    };
    const pending = { sequence, collection, sample, handlerAt };
    pendingInputs.set(sequence, pending);

    target.classList.toggle('input-hit', sequence % 2 === 0);
    target.dataset.lastInputSequence = String(sequence);
    requestAnimationFrame(frameAt => finishInputSample(pending, frameAt, true));
    setTimeout(() => {
      if (pendingInputs.has(sequence)) pending.sample.timedOut = true;
    }, INPUT_ACK_TIMEOUT_MS);
  }

  function flushPendingInputs() {
    const flushAt = performance.now();
    for (const pending of Array.from(pendingInputs.values())) {
      pending.sample.timedOut = pending.sample.timedOut || flushAt - pending.handlerAt > INPUT_ACK_TIMEOUT_MS;
      finishInputSample(pending, flushAt, false);
    }
  }

  function drawSource(context, width, height) {
    const now = performance.now();
    context.fillStyle = '#17181c';
    context.fillRect(0, 0, width, height);
    const x = (now * 0.15) % width;
    context.fillStyle = '#6e9eff';
    context.fillRect(x, 80, 120, 120);
    context.fillStyle = '#f5f5f7';
    context.font = '32px -apple-system, sans-serif';
    context.fillText(String(Math.floor(now)), 30, height - 40);
    sourceFrames += 1;
    requestAnimationFrame(() => drawSource(context, width, height));
  }

  function onVideoFrame(_now, metadata) {
    callbackCount += 1;
    if (firstFrameMs === null) firstFrameMs = performance.now() - startTime;
    const presented = Number(metadata.presentedFrames ?? callbackCount);
    if (presented <= lastPresented) nonMonotonic += 1;
    if (presented === lastPresented) presentedRepeats += 1;
    lastPresented = presented;
    video.requestVideoFrameCallback(onVideoFrame);
  }

  async function collectStats() {
    const stats = { reports: 0, types: [], inbound: null, codec: null };
    const observe = item => {
      if (!item || typeof item !== 'object') return;
      stats.reports += 1;
      if (item.type && !stats.types.includes(item.type)) stats.types.push(item.type);
      if (item.type === 'inbound-rtp' && (item.kind === 'video' || item.mediaType === 'video')) {
        stats.inbound = {
          framesDecoded: item.framesDecoded ?? null,
          framesReceived: item.framesReceived ?? null,
          framesDropped: item.framesDropped ?? null,
          framesPerSecond: item.framesPerSecond ?? null,
          decoderImplementation: item.decoderImplementation ?? null,
          powerEfficient: item.powerEfficient ?? null,
          codecId: item.codecId ?? null,
          totalDecodeTime: item.totalDecodeTime ?? null,
          jitterBufferDelay: item.jitterBufferDelay ?? null,
          jitterBufferEmittedCount: item.jitterBufferEmittedCount ?? null
        };
      }
      if (item.type === 'codec' && item.mimeType?.startsWith('video/')) {
        stats.codec = { mimeType: item.mimeType, codec: item.codec ?? null, payloadType: item.payloadType ?? null };
      }
    };
    for (const report of [outboundPeer, inboundPeer]) {
      if (!report) continue;
      const reportEntries = await report.getStats();
      if (typeof reportEntries.forEach === 'function') {
        reportEntries.forEach(observe);
      } else {
        for (const entry of reportEntries) {
          observe(Array.isArray(entry) && entry.length === 2 ? entry[1] : entry);
        }
      }
    }
    return stats;
  }

  async function run(durationSeconds) {
    try {
      startTime = performance.now();
      const width = 640, height = 360;
      sourceCanvas = document.createElement('canvas');
      sourceCanvas.width = width; sourceCanvas.height = height;
      const context = sourceCanvas.getContext('2d');
      sourceStream = sourceCanvas.captureStream(30);
      outboundPeer = new RTCPeerConnection({ iceServers: [] });
      inboundPeer = new RTCPeerConnection({ iceServers: [] });
      inboundPeer.ontrack = event => {
        remoteTrackReceived = true;
        video.srcObject = event.streams[0] || new MediaStream([event.track]);
        video.play().then(() => { remotePlaybackStarted = true; }).catch(error => send({ type: 'error', error: `video.play failed: ${error}` }));
        if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(onVideoFrame);
      };
      for (const track of sourceStream.getTracks()) outboundPeer.addTrack(track, sourceStream);
      outboundPeer.onicecandidate = event => event.candidate && inboundPeer.addIceCandidate(event.candidate).catch(() => {});
      inboundPeer.onicecandidate = event => event.candidate && outboundPeer.addIceCandidate(event.candidate).catch(() => {});
      const offer = await outboundPeer.createOffer();
      await outboundPeer.setLocalDescription(offer);
      await inboundPeer.setRemoteDescription(offer);
      const answer = await inboundPeer.createAnswer();
      await inboundPeer.setLocalDescription(answer);
      await outboundPeer.setRemoteDescription(answer);
      requestAnimationFrame(() => drawSource(context, width, height));
      setStatus('WebRTC loopback connected; collecting frame and input evidence…');
      setupReadyMs = performance.now() - startTime;
      send({ type: 'started' });

      const startedAt = performance.now();
      while (performance.now() - startedAt < durationSeconds * 1000) {
        await new Promise(resolve => setTimeout(resolve, 250));
      }
      const stats = await collectStats();
      flushPendingInputs();
      const summarizeLegacyInput = samples => {
        const values = samples.map(sample => sample.legacyResponseMs).filter(Number.isFinite);
        return {
          count: values.length,
          p50Ms: percentile(values, 0.50),
          p95Ms: percentile(values, 0.95),
          maxMs: values.length ? Math.max(...values) : null
        };
      };
      const summarizeAcknowledgedInput = samples => {
        const acknowledged = samples.filter(sample => sample.acknowledged && Number.isFinite(sample.handlerToNextAnimationFrameMs));
        const values = acknowledged.map(sample => sample.handlerToNextAnimationFrameMs);
        return {
          attemptedCount: samples.length,
          acknowledgedCount: acknowledged.length,
          missingAcknowledgementCount: samples.filter(sample => sample.missingAcknowledgement).length,
          timeoutCount: samples.filter(sample => sample.timedOut).length,
          p50Ms: percentile(values, 0.50),
          p95Ms: percentile(values, 0.95),
          maxMs: values.length ? Math.max(...values) : null
        };
      };
      const callbackFreshness = callbackCount ? (callbackCount - presentedRepeats) / callbackCount : 0;
      const functionalPlayback = Boolean(
        remoteTrackReceived &&
        remotePlaybackStarted &&
        video.readyState >= 3 &&
        callbackCount >= 100 &&
        callbackFreshness >= 0.99 &&
        nonMonotonic === 0
      );
      const frameFreshnessGate = stats.inbound && typeof stats.inbound.framesDecoded === 'number'
        ? (stats.inbound.framesDecoded > 0 && callbackFreshness >= 0.99 && nonMonotonic === 0 ? 'PASS' : 'FAIL')
        : 'NOT_OBSERVABLE';
      const hardwareFieldsObservable = Boolean(
        stats.inbound &&
        (stats.inbound.decoderImplementation !== null || stats.inbound.powerEfficient !== null)
      );
      const effectivePlaybackSeconds = firstFrameMs === null
        ? null
        : Math.max(0.001, durationSeconds - firstFrameMs / 1_000);
      const observedFramesPerSecond = effectivePlaybackSeconds !== null && stats.inbound &&
        typeof stats.inbound.framesDecoded === 'number'
        ? stats.inbound.framesDecoded / effectivePlaybackSeconds
        : null;
      send({ type: 'result', status: 'COMPLETED', result: {
        userAgent: navigator.userAgent,
        requestVideoFrameCallback: typeof video.requestVideoFrameCallback === 'function',
        hasRTCPeerConnection: typeof RTCPeerConnection === 'function',
        hasCanvasCaptureStream: Boolean(sourceCanvas && sourceCanvas.captureStream),
        remoteTrackReceived,
        remotePlaybackStarted,
        readyState: video.readyState,
        setupReadyMs,
        firstFrameMs,
        callbackCount,
        presentedRepeats,
        nonMonotonic,
        sourceFrames,
        functionalGate: functionalPlayback ? 'PASS' : 'FAIL',
        frameFreshnessGate,
        hardwareDecode: {
          observation: hardwareFieldsObservable ? 'OBSERVED' : 'NOT_OBSERVABLE',
          decoderImplementation: stats.inbound?.decoderImplementation ?? null,
          powerEfficient: stats.inbound?.powerEfficient ?? null
        },
        input: {
          metricVersion: 2,
          ackTimeoutMs: INPUT_ACK_TIMEOUT_MS,
          scriptedScheduledCount,
          scriptedDispatchedCount,
          scriptedCount: scripted.length,
          manualCount: manual.length,
          manualInputGate: manual.length > 0 ? 'OBSERVED' : 'NOT_TESTED',
          metricDefinitions: {
            legacyNextAnimationFrameMs: 'Elapsed from the existing callback/event-handler entry to the next requestAnimationFrame callback; retained for comparison, not a real input acknowledgement.',
            handlerToNextAnimationFrameMs: 'Elapsed from a dispatched event handler to the next requestAnimationFrame callback after the target visual state is updated; a DOM frame-boundary proxy, not glass-to-glass latency.'
          },
          legacyNextAnimationFrame: {
            scripted: summarizeLegacyInput(scripted),
            manual: summarizeLegacyInput(manual)
          },
          scripted: summarizeAcknowledgedInput(scripted),
          manual: summarizeAcknowledgedInput(manual),
          samples: { scripted, manual }
        },
        observedFramesPerSecond,
        stats
      }});
    } catch (error) {
      send({ type: 'error', error: String(error?.stack || error) });
    }
  }

  target.addEventListener('click', event => {
    if (event.isTrusted) recordInput(manual, 'manual-click', event);
  });
  target.addEventListener('keydown', event => {
    if (event.isTrusted) recordInput(manual, 'manual-key', event);
  });
  window.startProbe = durationSeconds => {
    run(durationSeconds);
    for (let i = 0; i < 100; i += 1) {
      scriptedScheduledCount += 1;
      const scheduledAtMs = performance.now() + i * 20;
      setTimeout(() => {
        const dispatchAtMs = performance.now();
        scriptedDispatchedCount += 1;
        target.dispatchEvent(new CustomEvent('idroid-scripted-input', {
          bubbles: true,
          detail: { scheduledAtMs }
        }));
        target.dataset.lastScriptedDispatchMs = String(dispatchAtMs - startTime);
      }, i * 20);
    }
  };
  target.addEventListener('idroid-scripted-input', event => {
    const dispatchAtMs = performance.now();
    recordInput(scripted, 'scripted-event', event, dispatchAtMs, event.detail?.scheduledAtMs ?? null);
  });
})();
</script>
</body>
</html>
